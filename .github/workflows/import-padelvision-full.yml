name: Import complete PadelVision AI folder

on:
  push:
    paths:
      - '.source-sync/padel/**'
      - '.github/workflows/import-padelvision-full.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-project:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild exact archived ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -d .source-sync/padel
          find .source-sync/padel -name 'part*.b64' -type f | sort > /tmp/padel_parts.txt
          test "$(wc -l < /tmp/padel_parts.txt)" -eq 13
          while IFS= read -r part; do cat "$part"; done < /tmp/padel_parts.txt | base64 --decode > /tmp/PadelVision_AI_v0.5_STRATEGY.zip
          echo 'd43fb9091820070ff135982cb2223731b22893a299ec3ae4e03d4dbd2dcacd56  /tmp/PadelVision_AI_v0.5_STRATEGY.zip' | sha256sum -c -

      - name: Replace source mirror with complete archived folder
        shell: bash
        run: |
          set -euo pipefail
          rm -rf projects/padelvision-ai
          mkdir -p projects/padelvision-ai
          unzip -q /tmp/PadelVision_AI_v0.5_STRATEGY.zip -d projects/padelvision-ai
          rm -rf .source-sync/padel

      - name: Commit complete PadelVision project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A projects/padelvision-ai .source-sync/padel || true
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'feat: upload complete PadelVision AI v0.5 project folder [skip ci]'
            git push
          fi
